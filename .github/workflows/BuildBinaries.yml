name: Build Binaries

on:
  push:
    paths-ignore:
      - '.github/*'
      - '*.md'
  pull_request:
    paths-ignore:
      - '.github/*'
      - '*.md'

jobs:
  build:
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'
    - uses: microsoft/setup-msbuild@v3
    - name: Clear local NuGet cache (workaround for failed restores on windows-latest)
      run: dotnet nuget locals all --clear
    - name: Build
      run: msbuild BuildAllTargets.proj
    - name: Verify disk snapshots
      run: python -X utf8 Tools/test_snapshots.py
    - name: Prepare artifacts
      run: python -X utf8 Tools/prepare_artifacts.py
    - uses: actions/upload-artifact@v7
      with:
        name: NanaBox_All_Binaries_GitHubActions
        path: Output\Binaries
